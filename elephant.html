<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voi Châu Phi | AniMend Stories</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="animal-detail-page">

    <!-- THANH ĐIỀU HƯỚNG (Dùng chung) -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="./assets/logo.png" alt="AniMend Stories Logo" class="logo-img"> 
            <span class="brand-name">AniMend Stories</span>
        </a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" style="color: #00e5ff;">Bảo vệ động vật hoang dã</a></li>
                <li><a href="news.html">Tin tức</a></li>
            </ul>
        </nav>
    </header>

    <!-- SECTION 1: HERO CỦA CON VẬT (Video nền + Tiêu đề) -->
    <section class="animal-hero">
        <video class="hero-video" autoplay loop muted playsinline>
            <!-- Thay bằng video con voi thực tế của bạn -->
            <source src="./assets/elephant-bg.mp4" type="video/mp4">
        </video>
        <div class="animal-hero-overlay"></div>
        
        <div class="animal-hero-content fade-up">
            <div class="partner-tag">
                <i class="fa-solid fa-paw"></i> Đối tác bảo tồn: Save the Elephants
            </div>
            <h1>VOI CHÂU PHI</h1>
            <div class="status-tag">
                <span class="status-dot"></span> Sách Đỏ: <strong>Cực kỳ nguy cấp</strong>
            </div>
        </div>
    </section>

   <!-- SECTION 2: BĂNG CHUYỀN THƯ VIỆN MEDIA (Chỉ Hình Ảnh) -->
    <section class="media-gallery fade-up">
        <div class="carousel-wrapper">
            <button class="carousel-control left" id="media-left">‹</button>
            
            <div class="carousel-container" id="media-carousel">
                
                <!-- Item 1: ẢNH PHÓNG TO -->
                <div class="media-card" data-type="image" data-src="./assets/elephant-large-1.jpg">
                    <img src="./assets/elephant-large-1.jpg" alt="Câu chuyện của voi Luna">
                    <div class="zoom-icon-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>

                <!-- Item 2: ẢNH PHÓNG TO -->
                <div class="media-card" data-type="image" data-src="./assets/elephant-large-2.jpg">
                    <img src="./assets/elephant-large-2.jpg" alt="Voi Châu Phi trong tự nhiên">
                    <div class="zoom-icon-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>

                <!-- Item 3: ẢNH PHÓNG TO -->
                <div class="media-card" data-type="image" data-src="./assets/elephant-large-3.jpg">
                    <img src="./assets/elephant-large-3.jpg" alt="Hành trình giải cứu">
                    <div class="zoom-icon-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>
                
                <!-- Item 4: ẢNH PHÓNG TO -->
                <div class="media-card" data-type="image" data-src="./assets/elephant-large-4.jpg">
                    <img src="./assets/elephant-large-4.jpg" alt="Đàn voi trên thảo nguyên">
                    <div class="zoom-icon-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
                </div>

            </div>
            
            <button class="carousel-control right" id="media-right">›</button>
        </div>
    </section>

    <!-- MODAL LIGHTBOX (Khung nổi để xem Video/Ảnh) -->
    <div id="mediaModal" class="modal">
        <span class="close-modal">&times;</span>
        <div class="modal-content" id="modalBody">
            <!-- JS sẽ bơm iframe Youtube hoặc thẻ img vào đây -->
        </div>
    </div>

    <!-- FOOTER (Dùng chung) -->
    <footer class="footer-cinematic">
        <div class="footer-noise"></div> 
        <div class="footer-container">
            <div class="footer-col footer-brand">
                <a href="index.html" class="logo">
                    <img src="./assets/logo.png" alt="AniMend Stories Logo" class="logo-img"> 
                    <span class="brand-name">AniMend Stories</span>
                </a>
                <p>Kết nối những trái tim yêu thiên nhiên, lan tỏa những thước phim giải cứu chân thực và kịch tính nhất.</p>
            </div>
            <!-- ... Giữ nguyên các phần khác của Footer ... -->
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
